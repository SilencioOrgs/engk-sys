org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ── Fix 1: tflite_flutter 0.12.x compiles Java sources at JVM 11 but the
#           Kotlin compiler targets JVM 17. Downgrade this to a warning so
#           the build does not fail outright.
kotlin.jvm.target.validation.mode=warning

# ── Fix 2: Kotlin incremental compilation writes cache files using paths
#           relative to the project root. On Windows, when the Pub cache
#           (C:\Users\...) and the project (U:\...) are on DIFFERENT drives,
#           kotlin.io.relativeTo() throws IllegalArgumentException and the
#           Kotlin daemon crashes mid-build (hand_landmarker, camera_android_camerax).
#           Disabling incremental compilation avoids this entirely.
kotlin.incremental=false
